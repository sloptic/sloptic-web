<!-- The reduced mark: one triangle in the lens, not four cells.
     The full mark (lib/brand.ts) puts three muted circles and one accent triangle inside the lens:
     sameness, and the one thing that is not. At 16px the lens interior is about 8 real pixels
     across, where four cells become one smudge, so the small mark keeps the idea and drops the
     grid. Same drawing, fewer cells, rather than a different logo.
     SVG rather than a generated PNG so it stays sharp on a hidpi tab strip. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <g fill="none" stroke="#1e211b" stroke-linecap="butt">
    <circle cx="13.5" cy="13.5" r="10.5" stroke-width="4"/>
    <!-- 34 degrees, not 45, and the joint is not rounded. That is where the drawn quality lives. -->
    <path d="M21.2 20.5 L30 27" stroke-width="4.5"/>
  </g>
  <path d="M13.5 8 L19.2 18.2 L7.8 18.2 Z" fill="#9e530d"/>
</svg>

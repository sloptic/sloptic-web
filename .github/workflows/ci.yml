name: CI

# The web suite is fast (seconds), so it runs on everything. The point is that a change which breaks
# the state machine, the authorization gates or the two-curve rule cannot reach main unnoticed: every
# one of those has broken here before, and each time it was found by reading rather than by a test.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Not a preference: jsdom declares ^22.22.2 || ^24.15.0 and its undici >=22.19.0. npm only
          # WARNS when an engine is unmet, so Node 20 installed cleanly here and then threw 35
          # unhandled errors out of undici at import time. package.json now declares the same floor.
          # 24 would satisfy it as well, but nothing here has been run on 24, so it is not claimed.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # No environment is provided on purpose. Every page is force-dynamic and reaches Supabase at
      # request time, so a build that needs a secret to succeed has moved work to build time that
      # does not belong there, and this step is where that shows up.
      - name: Build
        run: npm run build

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # it.fails and it.skip are how a known defect gets recorded here: the test states the correct
      # behaviour and is marked until the fix lands. That is only honest if the marker is temporary,
      # so a marker reaching main fails the build. To record a NEW defect, fix it or open an issue;
      # do not park it in the suite where a green run will imply it is covered.
      - name: No parked tests
        run: |
          if grep -rn "it\.fails(\|it\.skip(\|describe\.skip(\|test\.skip(" web/test; then
            echo "::error::A parked test reached main. Fix the defect, or delete the test and track it elsewhere."
            exit 1
          fi
          echo "no parked tests"

      # CLAUDE.md: no em dashes, use commas, colons, parentheses, periods. Cheap to check, and it
      # has regressed by hand several times.
      - name: House prose rule
        run: |
          if grep -rn "—" web/app web/lib --include="*.ts" --include="*.tsx"; then
            echo "::error::Em dash in source. Use commas, colons, parentheses, periods."
            exit 1
          fi
          echo "no em dashes"

      # web/lib/checks.generated.ts is the grader's catalog, committed so the Vercel build does not
      # need the sibling repo. Committing it means it can go stale, and staleness here is invisible:
      # the homepage keeps naming checks that moved or counting probes that no longer exist, and
      # every test still passes. So the file is regenerated and compared. The generator's own
      # docstring already asked for this; nothing enforced it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check facts match the grader
        run: |
          git clone --depth 1 --branch v2-dev https://github.com/sloptic/sloptic-main.git /tmp/sloptic-main
          python scripts/generate-checks.py --grader /tmp/sloptic-main
          if ! git diff --quiet -- web/lib/checks.generated.ts; then
            echo "::error::web/lib/checks.generated.ts is stale. Run scripts/generate-checks.py and commit."
            git --no-pager diff -- web/lib/checks.generated.ts
            exit 1
          fi
          echo "check facts match the catalog"

      # A migration number used twice means one of them silently never ran on a database that
      # already had the other. Numbers are assigned by hand, so this is worth checking.
      - name: Migration numbers are unique
        run: |
          dupes=$(ls supabase/migrations | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration number(s): $dupes"
            exit 1
          fi
          echo "migration numbers unique"

  worker:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sloptic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Worker compiles
        run: python -m compileall -q worker/sloptic_web_worker

      # The GRADER first. It is a dependency, not a copy (CLAUDE.md), the worker imports it, and
      # several suites reach it transitively through __main__ and grader.py. No PUBLISHED version
      # satisfies those imports: sloptic.devpost arrives in 2.2.0 and the tags stop at v2.1.0, so
      # PyPI's newest is missing a module the worker imports at start up. CI therefore installs the
      # same branch the worker box runs, which is the honest description of where this project is.
      # When 2.2.0 ships, this becomes a pinned version and the clone goes away.
      - name: Install the grader
        run: |
          git clone --depth 1 --branch v2-dev https://github.com/sloptic/sloptic-main.git /tmp/sloptic-main
          pip install --quiet -e /tmp/sloptic-main

      # From pyproject, not a hand-written list. The list was the bug: it predated dnspython and
      # httpx, so CI kept installing a subset that no longer matched what the code imports, and the
      # failure surfaced as a missing module rather than as a missing declaration.
      - name: Install the worker
        run: |
          pip install --quiet -e worker
          pip install --quiet pytest

      # Against a real Postgres, because the worker's logic IS its SQL: the lane ordering in
      # claim_job, FOR UPDATE SKIP LOCKED, the guards that make a pause outrank a claim, the partial
      # unique index behind one-live-run. A fake connection would assert none of it. The suite
      # builds the schema from the real migrations, so a migration that no longer applies in order
      # fails here rather than against a production database.
      - name: Worker tests
        working-directory: worker
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/sloptic_test
          PYTHONPATH: .
        run: python -m pytest tests/

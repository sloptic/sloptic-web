[project]
name = "sloptic-web-worker"
version = "0.1.0"
description = "Async worker for sloptic-web: claims grade jobs and runs the pinned sloptic grader passively."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    # The DNS half of owner verification. stdlib resolves names to addresses and cannot read TXT,
    # and the TXT record is the factor that proves control of the ZONE rather than of the server.
    "dnspython>=2.6",
    # Declared because verify_domain imports it directly. It was already present transitively
    # through the grader, which is not the same as being ours to rely on: the day the grader drops
    # it or pins it differently, an undeclared import becomes a crash at boot.
    "httpx>=0.27",
    # sloptic is the pinned GRADER, consumed not forked. It is not on PyPI, so install the sibling clone
    # in editable mode alongside this package (see README): pip install -e ../../sloptic-main
    # plus its browser deps for the passive a11y/CWV probes:
    #   pip install playwright && playwright install chromium
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sloptic_web_worker"]

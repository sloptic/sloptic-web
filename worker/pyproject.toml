[project]
name = "sloptic-web-worker"
version = "0.1.0"
description = "Async worker for sloptic-web: claims grade jobs and runs the pinned sloptic grader passively."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    # The DNS half of owner verification. stdlib resolves names to addresses and cannot read TXT,
    # and the TXT record is the factor that proves control of the ZONE rather than of the server.
    "dnspython>=2.6",
    # Declared because verify_domain imports it directly. It was already present transitively
    # through the grader, which is not the same as being ours to rely on: the day the grader drops
    # it or pins it differently, an undeclared import becomes a crash at boot.
    "httpx>=0.27",
    # The GRADER, consumed not forked, and pinned EXACTLY rather than with a floor. A grader that
    # moves changes what a score means: 3.0.0 is a new ruler (full curve 2026.4, passive curve
    # passive-2026.2), and a 3.0 score does not compare to a 2.x one. Both curves are vendored in
    # worker/curves/ from the v3.0.0 tag, together with the benchmark.py that ranks against them, and
    # ranking.py refuses any curve whose version does not match the ruler stamped on the grade.
    #
    # 3.x releases do not move the ruler (only 4.0 does), so a 3.x bump needs no new curve files. The
    # pin stays exact anyway: a release that changed a probe would change what a score means.
    #
    # This is also the single source of truth for the pin: scripts/generate-checks.py reads it and
    # refuses to generate against a different installed version.
    "sloptic==3.0.0",
    # Its browser deps for the a11y and CWV probes are not declared here, because they are a system
    # install rather than a wheel: pip install playwright && playwright install chromium
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sloptic_web_worker"]
